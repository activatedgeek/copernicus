name: Cloudflare Pages

on:
  # schedule:
  #   - cron: "0 12 * * *"
  workflow_dispatch:
    branches:
      - main
  push:
    branches:
      - main

env:
  ASTRO_SITE: ${{ vars.ASTRO_SITE }}
  GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
  GISCUS_REPO: ${{ github.repository }}
  GISCUS_REPO_ID: ${{ github.repository_id }}
  GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
  GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
  STATUS_SITE: ${{ vars.STATUS_SITE }}
  STATUS_SITE_ICON: ${{ vars.STATUS_SITE_ICON }}
  ## Node related.
  DISABLE_OPENCOLLECTIVE: 1
  ADBLOCK: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Get CV
        run: curl -o public/cv.pdf ${{ secrets.CV_URL }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build copernicus
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pages
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download Pages Artifact
        uses: actions/download-artifact@v8
        with:
          name: pages
          path: dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

      - name: Discord Notify
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: ${{ github.repository }}
